[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Francisco Parra"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/franciscoparrao/solarpv-rs"
description = "Terrain-aware photovoltaic potential engine in Rust (PVGIS lite)"
keywords = ["solar", "photovoltaic", "pvgis", "irradiance", "geospatial"]
categories = ["science::geo"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
solarpv-core = { path = "crates/core" }

# Terrain / raster layer reused from the SurtGIS engine family.
# Default features only (no gdal) so we don't pull system GDAL libs.
surtgis-core = { path = "../surtgis/crates/core" }
surtgis-algorithms = { path = "../surtgis/crates/algorithms" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
