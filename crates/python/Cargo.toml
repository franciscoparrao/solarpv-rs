[package]
name = "solarpv-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the solarpv-rs terrain PV-potential engine"
keywords = ["solar", "photovoltaic", "pyo3", "pv", "geospatial"]
categories = ["science::geo"]

[lib]
name = "solarpv"
crate-type = ["cdylib"]

[features]
default = []
# Re-export the gridded engine (requires terrain features and SurtGIS).
terrain = ["solarpv-core/terrain", "dep:surtgis-core", "dep:surtgis-algorithms"]
# GDAL-backed I/O through SurtGIS (requires system GDAL libraries).
gdal = ["terrain", "solarpv-core/gdal", "surtgis-core/gdal"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
solarpv-core = { workspace = true }
surtgis-core = { workspace = true, optional = true }
surtgis-algorithms = { workspace = true, optional = true }
